<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline Image Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    
    /* Top Bar Header */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      transition: opacity 0.3s ease;
    }

    .counter {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.25);
    }

    /* Fullscreen Viewport Slider */
    .viewport {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      touch-action: pan-y;
    }

    .slider {
      display: flex;
      height: 100%;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .slide {
      min-width: 100vw;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #000;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.25s ease-out;
    }

    /* Empty state display */
    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #888;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-state p { font-size: 14px; }

    /* Navigation Arrow Buttons */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .nav-arrow.left { left: 12px; }
    .nav-arrow.right { right: 12px; }
    .nav-arrow svg { width: 24px; height: 24px; fill: currentColor; }

    /* Indicator Dots */
    .dots-container {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 15;
      padding: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.25s ease;
    }

    .dot.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* Upload & Link Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: #1c1c1e;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal h3 { margin-bottom: 12px; font-size: 18px; text-align: center; }

    .modal textarea {
      width: 100%;
      height: 90px;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 12px;
      resize: none;
      outline: none;
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary { background: #0a84ff; color: #fff; }
    .btn-secondary { background: #3a3a3c; color: #fff; }
    .btn-danger { background: #ff453a; color: #fff; margin-top: 10px; width: 100%; }

  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="header" id="header">
    <div class="counter" id="counter">0 / 0</div>
    <div class="btn-group">
      <button class="btn" onclick="openModal()">+ Add / Edit</button>
      <button class="btn" onclick="resetToDefault()">Reset</button>
    </div>
  </div>

  <!-- Main Viewport Slider -->
  <div class="viewport" id="viewport">
    <div class="slider" id="slider"></div>

    <div class="empty-state" id="emptyState">
      <p>No Images Found</p>
      <button class="btn btn-primary" onclick="openModal()">Add Image Links</button>
    </div>

    <!-- Nav Arrows -->
    <button class="nav-arrow left" id="prevBtn" onclick="prevSlide()">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="nav-arrow right" id="nextBtn" onclick="nextSlide()">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>

    <!-- Dots -->
    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <!-- Modal window -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Manage Images</h3>
      <label style="font-size: 12px; color: #aaa; display:block; margin-bottom: 6px;">
        Paste image links below (one link per line):
      </label>
      <textarea id="urlInput" placeholder="images/1.jpg&#10;images/1-1.jpg&#10;images/2.jpg"></textarea>
      
      <div class="modal-actions">
        <button class="modal-btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="modal-btn btn-primary" onclick="saveLinks()">Save Links</button>
      </div>
      <button class="modal-btn btn-danger" onclick="clearAll()">Clear All Images</button>
    </div>
  </div>

  <script>
    // ========================================================
    // 1. YOUR DEFAULT IMAGE LINKS ARE SET HERE
    // ========================================================
    const DEFAULT_IMAGE_URLS = [
  "images/1.jpg",
  "images/1-1.jpg",
  "images/2.jpg",
  "images/2-1.jpg",
  "images/3.jpg",
  "images/3-1.jpg",
  "images/4.jpg",
  "images/4-1.jpg",
  "images/5.jpg",
  "images/5-1.jpg",
  "images/6.jpg",
  "images/6-1.jpg",
  "images/7.jpg",
  "images/7-1.jpg",
  "images/8.jpg",
  "images/8-1.jpg",
  "images/9.jpg",
  "images/9-1.jpg",
  "images/10.jpg",
  "images/10-1.jpg",
  "images/11.jpg",
    "images/11-1.jpg",
	  "images/12.jpg",
	    "images/12-1.jpg",
	    "images/13.jpg",
		  "images/13-1.jpg",
		   "images/14.jpg",
		    "images/14-1.jpg",
			 "images/15.jpg",
			  "images/15-1.jpg",
			   "images/16.jpg",
			    "images/16-1.jpg",
				 "images/17.jpg",
				  "images/17-1.jpg",
				   "images/18-1.jpg",
				    "images/19.jpg",
					 "images/19-1.jpg",
					  "images/19-1.jpg"
    ];

    let images = [];
    let currentIndex = 0;
    
    // Swipe & Touch variables
    let startX = 0;
    let currentTranslate = 0;
    let prevTranslate = 0;
    let isDragging = false;

    const slider = document.getElementById('slider');
    const counter = document.getElementById('counter');
    const dotsContainer = document.getElementById('dotsContainer');
    const emptyState = document.getElementById('emptyState');
    const modalOverlay = document.getElementById('modalOverlay');
    const urlInput = document.getElementById('urlInput');

    // Initialize App
    function init() {
      const saved = localStorage.getItem('offline_app_images');
      if (saved) {
        images = JSON.parse(saved);
      } else {
        images = [...DEFAULT_IMAGE_URLS];
      }
      render();
      setupTouchEvents();
    }

    // Render Images into DOM
    function render() {
      slider.innerHTML = '';
      dotsContainer.innerHTML = '';

      if (images.length === 0) {
        emptyState.style.display = 'flex';
        counter.textContent = '0 / 0';
        document.getElementById('prevBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      document.getElementById('prevBtn').style.display = 'flex';
      document.getElementById('nextBtn').style.display = 'flex';

      images.forEach((url, idx) => {
        // Create Slide
        const slide = document.createElement('div');
        slide.className = 'slide';

        const img = document.createElement('img');
        img.src = url.trim();
        img.alt = `Slide ${idx + 1}`;
        img.onerror = function() {
          // Fallback if image fails to load
          this.style.display = 'none';
          const errorMsg = document.createElement('div');
          errorMsg.style.color = '#ff453a';
          errorMsg.style.fontSize = '14px';
          errorMsg.textContent = `⚠️ Failed to load: ${url}`;
          slide.appendChild(errorMsg);
        };

        slide.appendChild(img);
        slider.appendChild(slide);

        // Create Dot
        const dot = document.createElement('div');
        dot.className = `dot ${idx === currentIndex ? 'active' : ''}`;
        dot.onclick = () => goToSlide(idx);
        dotsContainer.appendChild(dot);
      });

      updatePosition();
    }

    function updatePosition() {
      if (images.length === 0) return;
      
      // Ensure index stays in range
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= images.length) currentIndex = images.length - 1;

      currentTranslate = -currentIndex * window.innerWidth;
      prevTranslate = currentTranslate;
      slider.style.transform = `translateX(${currentTranslate}px)`;

      // Update counter
      counter.textContent = `${currentIndex + 1} / ${images.length}`;

      // Update dots
      const dots = dotsContainer.children;
      Array.from(dots).forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });
    }

    function nextSlide() {
      if (currentIndex < images.length - 1) {
        currentIndex++;
        updatePosition();
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        updatePosition();
      }
    }

    function goToSlide(index) {
      currentIndex = index;
      updatePosition();
    }

    // Touch & Swipe Mechanics
    function setupTouchEvents() {
      const viewport = document.getElementById('viewport');

      viewport.addEventListener('touchstart', touchStart);
      viewport.addEventListener('touchmove', touchMove);
      viewport.addEventListener('touchend', touchEnd);

      viewport.addEventListener('mousedown', touchStart);
      viewport.addEventListener('mousemove', touchMove);
      viewport.addEventListener('mouseup', touchEnd);
      viewport.addEventListener('mouseleave', () => isDragging && touchEnd());
    }

    function getPositionX(event) {
      return event.type.includes('mouse') ? event.clientX : event.touches[0].clientX;
    }

    function touchStart(event) {
      if (images.length === 0) return;
      isDragging = true;
      startX = getPositionX(event);
      slider.style.transition = 'none';
    }

    function touchMove(event) {
      if (!isDragging) return;
      const currentX = getPositionX(event);
      const diff = currentX - startX;
      currentTranslate = prevTranslate + diff;
      slider.style.transform = `translateX(${currentTranslate}px)`;
    }

    function touchEnd() {
      if (!isDragging) return;
      isDragging = false;
      slider.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
      
      const movedBy = currentTranslate - prevTranslate;

      if (movedBy < -50 && currentIndex < images.length - 1) {
        currentIndex++;
      } else if (movedBy > 50 && currentIndex > 0) {
        currentIndex--;
      }

      updatePosition();
    }

    // Modal Control Functions
    function openModal() {
      urlInput.value = images.join('\n');
      modalOverlay.style.display = 'flex';
    }

    function closeModal() {
      modalOverlay.style.display = 'none';
    }

    function saveLinks() {
      const lines = urlInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      images = lines;
      localStorage.setItem('offline_app_images', JSON.stringify(images));
      currentIndex = 0;
      render();
      closeModal();
    }

    function clearAll() {
      images = [];
      localStorage.setItem('offline_app_images', JSON.stringify([]));
      currentIndex = 0;
      render();
      closeModal();
    }

    function resetToDefault() {
      images = [...DEFAULT_IMAGE_URLS];
      localStorage.removeItem('offline_app_images');
      currentIndex = 0;
      render();
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (modalOverlay.style.display === 'flex') return;
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    window.addEventListener('resize', updatePosition);

    // Run on load
    init();
  </script>
</body>
</html>
